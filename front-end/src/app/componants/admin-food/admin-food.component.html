<div class="container-xxl py-5">
  <div class="container">

    <div class="text-center mb-5">
      <h5 class="section-title text-primary">Admin Panel</h5>
      <h1>Manage Food</h1>
      <p>Add or remove products from the menu.</p>
    </div>

    <!-- ADD PRODUCT -->
    <div class="card p-4 mb-5 shadow-sm">

      <h3 class="mb-4">Add New Food</h3>

      <div class="row g-3">

        <div class="col-md-6">
          <input
            [(ngModel)]="product.name"
            type="text"
            class="form-control"
            placeholder="Food name">
        </div>

        <div class="col-md-6">
          <input
            [(ngModel)]="product.price"
            type="number"
            class="form-control"
            placeholder="Price">
        </div>

                <div class="col-md-6">
        <select
            [(ngModel)]="product.category.id"
            class="form-control">

            <option [ngValue]="null">Select Category</option> // هنا حددتت الكاتيجوريز علشان تكون اسهل 

            <option [ngValue]="2">Main Food</option>
            <option [ngValue]="4">Appetizers & Salads</option>
            <option [ngValue]="5">Juices</option>
            <option [ngValue]="6">Juices</option>
            <option [ngValue]="7">Hot Drinks</option>

        </select>
        </div>

        <div class="col-md-12">
          <input
            [(ngModel)]="product.imagePath"
            type="text"
            class="form-control"
            placeholder="Image path">
        </div>

        <div class="col-md-12">
          <textarea
            [(ngModel)]="product.description"
            class="form-control"
            rows="4"
            placeholder="Description">
          </textarea>
        </div>

        <div class="col-md-12">
          <button
            class="btn btn-primary"
            (click)="addProduct()">
            <i class="fa fa-plus me-2"></i>
            Add Food
          </button>
        </div>

      </div>
    </div>

    <!-- PRODUCTS LIST -->
<div class="card p-4 shadow-sm">

  <h3 class="mb-4">Current Food</h3>

  <div
    *ngFor="let product of products"
    class="d-flex justify-content-between align-items-center border-bottom py-3">

    <div>
      <h5 class="mb-1">{{ product.name }}</h5>

      <small class="text-muted">
        ID: {{ product.id }}
        |
        ${{ product.price }}
      </small>
    </div>

    <button
      class="btn btn-danger btn-sm"
      (click)="deleteProduct(product.id)">

      <i class="fa fa-trash me-1"></i>
      Delete

    </button>

  </div>

</div>

    <!-- MESSAGE -->
    <div *ngIf="message" class="alert alert-info mt-4">
      {{ message }}
    </div>

  </div>
</div>
