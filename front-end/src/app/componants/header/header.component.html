<div class="container-xxl position-relative p-0">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 px-lg-5 py-3 py-lg-0">
    <a routerLink="/products" class="navbar-brand p-0">
      <h1 class="text-primary m-0"><i class="fa fa-utensils me-3"></i>Restaurant</h1>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
      <span class="fa fa-bars"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarCollapse">
      
      <input *ngIf="isUserLogin()" #key class="form-control" type="search" placeholder="Search" aria-label="Search" (input)="search(key.value)">
      
      <div class="navbar-nav ms-auto py-0 pe-4">
        <div *ngIf="!isAuthPage()" class="nav-item nav-link active"><a routerLink="/products">Home</a></div>
        <div *ngIf="isUserLogin() && !isAdmin()" class="nav-item nav-link active">
  <a routerLink="/contact-info">Contact</a>
</div>
        <div *ngIf="isUserLogin()" class="nav-item nav-link active"><a routerLink="/chefs">Team</a></div>
        
        <div class="nav-item nav-link active position-relative" *ngIf="isUserLogin() && !isAdmin()">
    <a routerLink="/my-messages" style="cursor: pointer; position: relative; display: inline-block;">
        <i class="fa fa-bell fa-lg"></i>
        
        <span *ngIf="unreadCount > 0" 
              class="position-absolute badge rounded-pill bg-danger"
              style="top: -5px; right: -10px; font-size: 0.6rem;">
            {{ unreadCount }}
        </span>
    </a>
</div>
        <div *ngIf="!isUserLogin() && !isAuthPage()" class="nav-item nav-link active"><a routerLink="/login">login</a></div>
        <div *ngIf="!isUserLogin() && !isAuthPage()" class="nav-item nav-link active"> <a routerLink="/signup">signup</a></div>
        <!-- <div *ngIf="isUserLogin()" class="nav-item nav-link active"><a href="" (click)="logOut()">logout</a></div> -->

        <div class="nav-item dropdown" *ngIf="isUserLogin()">
    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
       Services
    </a>
    <div class="dropdown-menu m-0">
        <a routerLink="/orders-user" class="dropdown-item">My Orders</a>
        <a routerLink="/profile" class="dropdown-item">Profile</a>
        
        <div *ngIf="isAdmin()">
            <div class="dropdown-divider"></div>
            <a routerLink="/admin" class="dropdown-item text-danger fw-bold">
                <i class="fa fa-cogs me-2"></i> Admin Panel
            </a>
        </div>
        
        <div class="dropdown-divider"></div>
        <a (click)="logOut()" class="dropdown-item" style="cursor: pointer;">Logout</a>
     </div>
    </div>
     
      </div>
    </div>
    <app-card *ngIf="isUserLogin()"></app-card>
  </nav>

  <div class="container-xxl py-5 bg-dark hero-header mb-5">
  </div>
</div>
