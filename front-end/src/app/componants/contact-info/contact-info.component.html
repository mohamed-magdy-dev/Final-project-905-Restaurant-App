<div class="container-xxl position-relative p-0">
  <div class="container-xxl py-5 bg-dark hero-header mb-5">
    <div class="container text-center my-5 pt-5 pb-4">
      <h1 class="display-3 text-white mb-3 animated slideInDown">Contact Us</h1>
    </div>
  </div>
</div>

<div class="container-xxl py-5">
  <div class="container">
    <div class="text-center wow fadeInUp" data-wow-delay="0.1s">
      <h5 class="section-title ff-secondary text-center text-primary fw-normal">Get In Touch</h5>
      <h1 class="mb-5">We love to hear from you</h1>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded overflow-hidden">
          <div class="card-body p-5">
            
            <div *ngIf="successMessage" class="alert alert-success text-center mb-4">
              <i class="fa fa-check-circle me-2"></i> {{ successMessage }}
            </div>

             <div *ngIf="errorMessage" class="alert alert-danger text-center mb-4">
              <i class="fa fa-exclamation-circle me-2"></i> {{ errorMessage }}
            </div>

            <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
              <div class="row g-3">
                
               <div class="col-md-6">
  <div class="form-floating">
    <input type="text" class="form-control" id="name" formControlName="name">
    <label for="name">Your Name</label>
  </div>
</div>

<div class="col-md-6">
  <div class="form-floating">
    <input type="email" class="form-control" id="email" formControlName="email">
    <label for="email">Your Email</label>
  </div>
</div>

                <div class="col-12">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="subject" placeholder="Subject" formControlName="subject"
                           [ngClass]="{ 'is-invalid': isSubmitted && f['subject'].errors }">
                    <label for="subject">Subject</label>
                    <div *ngIf="isSubmitted && f['subject'].errors" class="invalid-feedback ps-2">
                      Please enter a subject.
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Leave a message here" id="message" style="height: 150px" formControlName="message"
                              [ngClass]="{ 'is-invalid': isSubmitted && f['message'].errors }"></textarea>
                    <label for="message">Message</label>
                    <div *ngIf="isSubmitted && f['message'].errors" class="invalid-feedback ps-2">
                      Please enter your message (at least 10 characters).
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <button class="btn btn-primary w-100 py-3 fw-bold" type="submit" [disabled]="contactForm.invalid">
                    <i class="fa fa-paper-plane me-2"></i> Send Message
                  </button>
                </div>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
