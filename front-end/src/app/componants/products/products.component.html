<div class="tab-content">
  <div id="tab-1" class="tab-pane fade show p-0 active">
    <div class="row g-4" *ngIf="products.length !== 0">
      <div class="row">
        
        <div *ngFor="let pro of products" class="col-lg-6 mb-3">
          <div class="card h-100 shadow-sm">
            <div class="card-body d-flex">

              <img class="flex-shrink-0 img-fluid rounded"
                   src="../../../assets/img/{{pro.imagePath}}"
                   alt="{{pro.name}}"
                   style="width: 80px; height: 80px; object-fit: cover;">

              <div class="w-100 d-flex flex-column text-start ps-4">
                <h5 class="d-flex justify-content-between border-bottom pb-2">
                  <span>{{pro.name}}</span>
                  <span class="text-primary">${{pro.price}}</span>
                </h5>
                <small class="fst-italic mb-2">{{pro.description | slice:0:50}}...</small>

                <div class="mt-auto d-flex gap-2 flex-wrap">
                  
                  <button type="button" class="btn btn-success btn-sm" (click)="addProduct(pro)">
                    <i class="fa fa-cart-plus"></i>
                  </button>
<!-- 
                  <button *ngIf="isAdmin()" type="button" class="btn btn-warning btn-sm">
                    <i class="fa fa-edit"></i>
                  </button>

                  <button *ngIf="isAdmin()" type="button" class="btn btn-danger btn-sm">
                    <i class="fa fa-trash"></i>
                  </button> -->

                  <button type="button" 
                          class="btn btn-info btn-sm text-white" 
                          data-bs-toggle="modal" 
                          [attr.data-bs-target]="'#infoModal' + pro.id">
                    <i class="fa fa-info-circle"></i>
                  </button>
                  
                </div>
              </div>
            </div>
          </div>

          <div class="modal fade" [id]="'infoModal' + pro.id" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-header bg-light">
                  <h5 class="modal-title fw-bold text-primary">{{pro.name}}</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                  <img src="../../../assets/img/{{pro.imagePath}}" class="img-fluid rounded mb-3" style="max-height: 200px;">
                  <p class="text-muted">{{pro.description}}</p>
                  <h4 class="text-success mt-3">Price: ${{pro.price}}</h4>
                </div>
                <div class="modal-footer justify-content-center">
                   <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                   <button type="button" class="btn btn-success" (click)="addProduct(pro)" data-bs-dismiss="modal">
                     Add to Cart <i class="fa fa-cart-plus ms-1"></i>
                   </button>
                </div>
              </div>
            </div>
          </div>
          </div>
        </div>

      <div class="col-md-9 pag" style="padding-left: 30%">
            <ngb-pagination
              [(page)]="pageNumber"
              [pageSize]="pageSize"
              [collectionSize]="totalProductSize"
              (pageChange)="pagination()"
              [maxSize]="5"
              [boundaryLinks]="true"
            >
            </ngb-pagination>

        <div class="sel">
          <span class="mr-2">Page Size</span>
          <select (change)="changePageSize($event)">
            <option>2</option>
            <option>5</option>
            <option selected="true">10</option>
            <option>20</option>
            <option>50</option>
          </select>
        </div>
      </div>
    </div>

    <div class="container" *ngIf="products.length === 0">
      <div class="alert alert-light shadow message-box">
        <p class="message-ar mb-1">{{messageAr}}</p>
        <p class="message-en mb-0">{{messageEn}}</p>
      </div>
    </div>
  </div>
</div>
