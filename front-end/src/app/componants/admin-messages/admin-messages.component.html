<div class="container py-5">
    <div class="text-center mb-5">
        <h5 class="section-title ff-secondary text-center text-primary fw-normal">Admin Dashboard</h5>
        <h1 class="mb-5">Customer Messages</h1>
    </div>

    <!-- ضيف الجزء ده هنا عشان يعرض الرسايل -->
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div *ngIf="successMessage" class="alert alert-success text-center mb-4 shadow-sm">
                <i class="fa fa-check-circle me-2"></i> {{ successMessage }}
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger text-center mb-4 shadow-sm">
                <i class="fa fa-exclamation-circle me-2"></i> {{ errorMessage }}
            </div>
        </div>
    </div>
    <!-- بداية الـ card بتاع الجدول الموجود عندك أصلاً -->


    <div class="card shadow border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Date</th>
                            <th>Customer</th>
                            <th>Subject</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let msg of messages">
                            <td class="ps-4 text-muted">{{ msg.messageDate | date:'short' }}</td>
                            
                            <td>
                                <div class="fw-bold">{{ msg.name }}</div>
                                <small class="text-muted">{{ msg.email }}</small>
                            </td>
                            
                            <td>
                                <span class="d-inline-block text-truncate" style="max-width: 200px;">
                                    {{ msg.subject }}
                                </span>
                            </td>

                            <td>
                                <span *ngIf="msg.replied" class="badge bg-success rounded-pill">Replied</span>
                                <span *ngIf="!msg.replied" class="badge bg-warning text-dark rounded-pill">Pending</span>
                            </td>

                            <td class="text-end pe-4">
                                <button *ngIf="!msg.replied" 
                                        class="btn btn-sm btn-primary" 
                                        data-bs-toggle="modal" 
                                        data-bs-target="#replyModal"
                                        (click)="openReplyModal(msg)">
                                    <i class="fa fa-reply me-1"></i> Reply
                                </button>
                                
                                <span *ngIf="msg.replied" class="text-muted small">
                                    <i class="fa fa-check-circle text-success"></i> Done
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div *ngIf="messages.length === 0" class="text-center py-5">
                <p class="text-muted">No messages found.</p>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="replyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Reply to Customer</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Your Reply:</label>
                        <textarea [(ngModel)]="replyData.adminReply" 
                                  name="replyBody" 
                                  rows="4" 
                                  class="form-control" 
                                  placeholder="Type your response here..."></textarea>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" id="closeModalBtn" class="d-none" data-bs-dismiss="modal">Close</button>
                
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" (click)="submitReply()">
                    <i class="fa fa-paper-plane me-1"></i> Send Reply
                </button>
            </div>
        </div>
    </div>
</div>
