<div class="container py-5">
    <div class="text-center mb-5">
        <h5 class="section-title ff-secondary text-center text-primary fw-normal">Support</h5>
        <h1 class="mb-5">My Messages History</h1>
    </div>

    <div *ngIf="isLoading" class="text-center">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div *ngIf="!isLoading && messages.length === 0" class="alert alert-info text-center">
        You haven't sent any messages yet. <a routerLink="/contact-info">Contact Us</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            
            <div *ngFor="let msg of messages" class="card shadow-sm mb-4 border-0">
                
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-white" style="font-size: 1.1rem;">
                        <i class="fa fa-envelope me-2"></i> {{ msg.subject }}
                    </h5>
                    <small class="text-light">{{ msg.messageDate | date:'medium' }}</small>
                </div>

                <div class="card-body">
                    <h6 class="text-primary fw-bold">My Message:</h6>
                    <p class="card-text text-muted mb-4">{{ msg.message }}</p>

                    <div *ngIf="msg.adminReply" class="alert alert-success mt-3 border-0 shadow-sm" style="background-color: #d1e7dd;">
                        <div class="d-flex align-items-start">
                            <i class="fa fa-user-shield fa-2x me-3 text-success"></i>
                            <div>
                                <h6 class="fw-bold text-success mb-1">Admin Response</h6>
                                <p class="mb-1 text-dark">{{ msg.adminReply }}</p>
                                <small class="text-muted" style="font-size: 0.75rem;">
                                    Replied on: {{ msg.replyDate | date:'medium' }}
                                </small>
                            </div>
                        </div>
                    </div>

                    <div *ngIf="!msg.adminReply" class="mt-3">
                        <span class="badge bg-warning text-dark">
                            <i class="fa fa-clock me-1"></i> Waiting for reply...
                        </span>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
